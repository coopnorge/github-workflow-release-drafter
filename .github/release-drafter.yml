name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
categories:
  - title: "🔥 BREAKING CHANGES"
    exclusive: true
    when:
      label: "release-drafter:breaking-change"
  - title: "⬆️ Dependencies Upgraded"
    collapse-after: 5
    exclusive: true
    when:
      label: "release-drafter:dependency"
  - title: "🚀 Features"
    when:
      label: "release-drafter:enhancement"
  - title: "🐛 Bug Fixes"
    when:
      label: "release-drafter:bug-fix"
  - title: "👷 Chores"
    when:
      label: "release-drafter:chore"
  - title: "⚡️ Deprecations"
    when:
      label: "release-drafter:deprecation"
  - type: pre-exclude
    when:
      label: "skip-changelog"
  - type: version-resolver
    semver-increment: major
    when:
      label: "release-drafter:major"
  - type: version-resolver
    semver-increment: major
    when:
      label: "release-drafter-go:major"
  - type: version-resolver
    semver-increment: minor
    when:
      label: "release-drafter:minor"
  - type: version-resolver
    semver-increment: minor
    when:
      label: "release-drafter-go:minor"
  - type: version-resolver
    semver-increment: patch
    when:
      label: "release-drafter:patch"
  - type: version-resolver
    semver-increment: patch
    when:
      label: "release-drafter-go:patch"
  - type: version-resolver
    semver-increment: patch
replacers:
  # https://github.com/release-drafter/release-drafter/issues/569#issuecomment-645938155
  - search: '(?:and )?@dependabot(?:\[bot\])?,?'
    replace: ""
exclude-contributors:
  - "dependabot"
autolabeler:
  # labels to help with version determination
  # if you want to play around with the regex here
  # I will suggest doing so on https://regex101.com/
  # it provides good explanation what what the regex is doing
  # If that is not enough, ask chatgpt for help,
  # and then go back to playing with regex on regex101.com

  # Dependency updates (Renovate, Dependabot or human) are always labeled
  # "dependency" + "patch" and never evaluated by the rules below, so features
  # or "BREAKING CHANGE:" text in upstream release notes cannot cause a
  # minor/major bump. Add "release-drafter:breaking-change" and "release-drafter:major"
  # manually if needed.
  - labels: ["release-drafter:dependency", "release-drafter:patch"]
    stop-on-match: true
    title:
      - "/^Bump/" # Dependabot
      # matches "chore(deps): ...", "fix(deps-dev): ...", "build(deps)!: ..."
      - '/^[a-z]+\(deps(?:-dev)?\)!?:\s.*/i'
    branch:
      - '/^(?:renovate|dependabot)\//'
  - label: "release-drafter:patch"
    title:
      # matches in format of "fix: ..."
      # or "fix(scope): ..."
      - '/^(?:fix|chore|docs|doc|refactor|test|deprecated)(?:\((?:[^)]+)\))?:\s.*/i'
  - label: "release-drafter:minor"
    title:
      # matches in format of "feat: ..."
      # or "feat(scope): ..."
      - '/^(?:feat|feature)(?:\((?:[^)]+)\))?:\s.*/i'
  - label: "release-drafter:major"
    title:
      # matches in format of "fix!: ..."
      # or "fix!(scope): ..."
      # or "fix(scope)!: ..."
      - '/^(?:feat|feature|fix|chore|docs|doc|refactor|test|deprecated)(?:!(?:\((?:[^)]+)\))|(?:\((?:[^)]+)\))!|!):\s.*/i'
    body:
      - "/BREAKING CHANGE:/"
  # labels to help with changelog grouping
  - label: "release-drafter:chore"
    title:
      - '/^(?:docs|doc|chore|refactor|test)(?:\((?:[^)]+)\))?:\s.*/i'
  - label: "release-drafter:enhancement"
    title:
      - '/^(?:feat|feature)(?:\((?:[^)]+)\))?:\s.*/i'
  - label: "release-drafter:bug-fix"
    title:
      - '/^fix(?:\((?:[^)]+)\))?:\s.*/i'
  - label: "release-drafter:deprecation"
    title:
      - '/^deprecated(?:\((?:[^)]+)\))?:\s.*/i'
  - label: "release-drafter:breaking-change"
    title:
      - '/^(?:feat|feature|fix|chore|docs|doc|refactor|test|deprecated)(?:!(?:\((?:[^)]+)\))|(?:\((?:[^)]+)\))!|!):\s.*/i'
    body:
      - "/BREAKING CHANGE:/"
template: |
  ## What's Changed
  $CHANGES
