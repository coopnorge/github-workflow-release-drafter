on:
  workflow_call:
    secrets: {}
    inputs:
      config-name:
        type: string
        description: >-
          Config filename. This should either be present in your repository's
          .github folder or .github repo's .github folder.
        required: false
        default: release-drafter.yml
      commitish:
        type: string
        description: >-
          Commitish to use when calculating the version bump. Defaults to the
          pull request base branch.
        required: false
        default: main
      publish:
        type: boolean
        description: Publish the release draft. Defaults to false.
        required: false
        default: false
      project-path:
        type: string
        description: The path to go project
        required: false
        default: .
      ignore-major-changes-for-pattern:
        type: string
        description: >-
          A regular expression pattern to match against incompatible changes.
          If incompatible changes are detected on api-diff's output  matching this pattern, the release drafter will not bump the major version.
          Eg: (\S+)\/(v\d+beta\d+)\.(\S+), this will ignore incompatible changes
          in the api-diff output, matching
          ./coopnorge/<projectpath>/v1beta2.(<RPCNameORMessageName>).GetEmailAddresses: removed
        required: false
        default: ""
    outputs:
      id:
        value: ${{ jobs.draft-release.outputs.id }}
        description: >-
          The ID of the release that was created or updated.
      name:
        value: ${{ jobs.draft-release.outputs.name }}
        description: >-
          The name of this release.
      tag_name:
        value: ${{ jobs.draft-release.outputs.tag_name }}
        description: >-
          The name of the tag associated with this release.
      body:
        value: ${{ jobs.draft-release.outputs.body }}
        description: >-
          The body of the drafted release, useful if it needs to be included  in files.
      html_url:
        value: ${{ jobs.draft-release.outputs.html_url }}
        description: >-
          The URL users can navigate to in order to view the release.  i.e. https://github.com/octocat/Hello-World/releases/v1.0.0.
      upload_url:
        value: ${{ jobs.draft-release.outputs.upload_url }}
        description: >-
          The URL for uploading assets to the release, which could be  used by GitHub Actions for additional uses, for example the  @actions/upload-release-asset GitHub Action.

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  label-pr-go:
    if: github.event_name == 'pull_request'
    name: Label PR (Golang)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "${{ inputs.project-path }}/go.mod"
          cache-dependency-path: "${{ inputs.project-path }}/go.sum"
      - name: Configure access to internal and private GitHub repos
        run: |
          if [ -n "${{ secrets.REVIEWBOT_GITHUB_TOKEN }}" ]; then
            git config --global url."https://${{ secrets.REVIEWBOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/coopnorge".insteadOf "https://github.com/coopnorge";
          else
            echo "REVIEWBOT_GITHUB_TOKEN is not set. Skipping Git configuration.";
          fi
      - name: Install API DIff
        run: go install golang.org/x/exp/cmd/apidiff@latest
      - name: Detect module path change
        id: modpath
        run: |
          cd ${{ inputs.project-path }}
          # A Go major bump (v1 -> v2 and beyond) requires changing the module path in go.mod.
          if git diff origin/main HEAD -- go.mod | grep -qE '^[+-]module '; then
            echo "go.mod module path changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Get PR diff
        id: apidiff
        run: |
          cd ${{ inputs.project-path }}
          git diff --name-only origin/main HEAD | grep '\.go$' > changes.txt || true
          if [ -s changes.txt ]; then
            echo "Detected Go changes. Checking API diff..."

            apidiff -m -w new.txt ./...

            git checkout origin/main
            apidiff -m -w old.txt ./...

            DIFFERENCE=$(apidiff -m old.txt new.txt)
            if [ "$DIFFERENCE" != "" ]; then
              echo "API diff detected. $DIFFERENCE"

              if echo "$DIFFERENCE" | grep -q -i "incompatible change"; then
                if [ "${{ inputs.ignore-major-changes-for-pattern }}" != "" ]; then

                  if apidiff -m -incompatible old.txt new.txt | grep -qvE "${{ inputs.ignore-major-changes-for-pattern }}"; then
                    # Not ignored by the pattern: flag as breaking, but never bump major here.
                    # Major bumps are driven by the go.mod module path (see "Detect module path change").
                    echo "Incompatible API change detected."
                    echo "semver-type=minor" >> $GITHUB_OUTPUT
                    echo "breaking=true" >> $GITHUB_OUTPUT
                  else
                    echo "Incompatible API change detected, but ignored by pattern."
                    echo "semver-type=minor" >> $GITHUB_OUTPUT
                  fi
                else
                  echo "Incompatible API change detected."
                  echo "semver-type=minor" >> $GITHUB_OUTPUT
                  echo "breaking=true" >> $GITHUB_OUTPUT
                fi
              elif echo "$DIFFERENCE" | grep -q -i "compatible change"; then
                echo "Compatible API change detected."
                echo "semver-type=minor" >> $GITHUB_OUTPUT
              else
                echo "Non-breaking API change detected."
                echo "semver-type=patch" >> $GITHUB_OUTPUT
              fi
            else
              echo "No API diff detected."
              echo "semver-type=patch" >> $GITHUB_OUTPUT
            fi
          else
            echo "No Go changes detected."
            echo "semver-type=patch" >> $GITHUB_OUTPUT
          fi
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request'
        env:
          LABEL: "${{ steps.apidiff.outputs.semver-type }}"
          BREAKING: "${{ steps.apidiff.outputs.breaking }}"
          MODULE_CHANGED: "${{ steps.modpath.outputs.changed }}"
        with:
          script: |
            const { LABEL, BREAKING, MODULE_CHANGED } = process.env;
            // Major only when the module path changed; apidiff alone never bumps major.
            const semver = MODULE_CHANGED === 'true' ? 'major' : LABEL;
            const labels = [`release-drafter-go:${semver}`];
            if (BREAKING === 'true') labels.push('release-drafter:breaking-change');
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels
            })
  draft-release:
    name: Draft Release
    uses: ./.github/workflows/release-drafter.yaml
    with:
      config-name: "${{ inputs.config-name }}"
      commitish: "${{ inputs.commitish }}"
      publish: ${{ inputs.publish }}
    permissions:
      pull-requests: write
      contents: write
      issues: write
  verify-major-bump:
    if: github.event_name == 'pull_request'
    name: Verify major bump is intentional
    needs: draft-release
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          if ! echo "$labels" | grep -qE '^release-drafter(-go)?:major$'; then
            echo "No major bump requested."
            exit 0
          fi

          cd "$PROJECT_PATH"
          module=$(sed -n 's/^module[[:space:]]\+\(\S\+\).*/\1/p' go.mod | head -1)
          latest=$(git tag --list 'v[0-9]*' | sort -V | tail -1)
          latest_major=${latest#v}; latest_major=${latest_major%%.*}
          latest_major=${latest_major:-0}

          if [ "$latest_major" = "0" ]; then
            # v0 -> v1: no path change, so require an explicit human label.
            if echo "$labels" | grep -qx 'release-drafter-go:allow-v1'; then
              echo "Leaving v0 explicitly allowed via release-drafter-go:allow-v1."
              exit 0
            fi
            echo "::error::A major label would take this module out of v0 (latest tag: ${latest:-none}). Breaking changes are allowed in v0. If you really want v1.0.0, add the label 'release-drafter-go:allow-v1'; otherwise remove the major label."
            exit 1
          fi

          # v1+: a major bump requires the module path to carry the next major (/vN+1).
          next=$((latest_major + 1))
          if echo "$module" | grep -qE "/v${next}$"; then
            echo "Module path is ${module}, matching v${next}."
            exit 0
          fi
          echo "::error::A major label would release v${next}.0.0, but go.mod module path is '${module}' (expected a '/v${next}' suffix). Remove the major label, or update go.mod and all import paths."
          exit 1
